name: insert-date-countdown

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/insert-date-countdown.yml

jobs:
  insert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-xav59213-date-countdown
          fetch-depth: 0
      - name: Insert repository and remove helper
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("integration")
          text = p.read_text()
          entry = "XAV59213/date_countdown"
          if entry in text:
              print("already present")
          else:
              old = '  "xathon/Allianz-BonusDrive-HomeAssistant",\n  "Xerolux/idm-heatpump-hass",'
              new = '  "xathon/Allianz-BonusDrive-HomeAssistant",\n  "XAV59213/date_countdown",\n  "Xerolux/idm-heatpump-hass",'
              if old not in text:
                  raise SystemExit("anchor missing")
              p.write_text(text.replace(old, new, 1))
              print("inserted")
          PY
          git config user.name "XAV59213"
          git config user.email "153436936+XAV59213@users.noreply.github.com"
          git add integration
          git rm -f .github/workflows/insert-date-countdown.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Add XAV59213/date_countdown to default integrations"
            git push
          fi
