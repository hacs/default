name: Add Marstek BLE default entry

on:
  push:
    branches:
      - add-marstek-ble
    paths:
      - .github/workflows/add-marstek-ble.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.0
        with:
          ref: add-marstek-ble

      - name: Add repository and keep list sorted
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("integration")
          repos = json.loads(path.read_text())
          repo = "Cappa83/marstek-ble-ha"
          if repo not in repos:
              repos.append(repo)
          repos.sort(key=str.casefold)
          path.write_text(json.dumps(repos, indent=2) + "\n")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/add-marstek-ble.yml

      - name: Commit HACS entry
        run: |
          git config user.name "Cappa83"
          git config user.email "86222596+Cappa83@users.noreply.github.com"
          git add integration .github/workflows/add-marstek-ble.yml
          git commit -m "Add Cappa83/marstek-ble-ha"
          git push origin HEAD:add-marstek-ble
