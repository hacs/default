name: Fix Eshtaya HACS submission

on:
  push:
    branches:
      - add-eshtaya-smart-control

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update repository name in integration list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('integration')
          text = p.read_text()
          old = 'badereshtaya/hacs-eshtaya-smart-control'
          new = 'badereshtaya/eshtaya-smart-control'
          if old not in text:
              raise SystemExit('Old repository name not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit minimal rename
        run: |
          rm -f .github/workflows/fix_eshtaya_repo_name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration .github/workflows/fix_eshtaya_repo_name.yml
          git commit -m 'Updates integration repository to badereshtaya/eshtaya-smart-control'
          git push
