name: Add freebox_homexa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean branch and insert one line
        run: |
          set -euo pipefail
          git checkout -B add-freebox-homexa-clean 765ba16f0af673fbc521fc7d9e086d1ec2b2c2b7
          python3 <<'PY'
          from pathlib import Path
          p = Path('integration')
          text = p.read_text()
          needle = '  "xathon/Allianz-BonusDrive-HomeAssistant",\n  "Xerolux/idm-heatpump-hass",'
          insert = '  "xathon/Allianz-BonusDrive-HomeAssistant",\n  "XAV59213/freebox_homexa",\n  "Xerolux/idm-heatpump-hass",'
          if 'XAV59213/freebox_homexa' not in text:
              if needle not in text:
                  raise SystemExit('anchor not found')
              p.write_text(text.replace(needle, insert, 1))
          print('ok')
          PY
          git config user.name "XAV59213"
          git config user.email "153436936+XAV59213@users.noreply.github.com"
          git add integration
          git commit -m "Adds new integration [XAV59213/freebox_homexa]"
          git push -u origin add-freebox-homexa-clean
