name: Insert freesmsxa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset target branch to upstream and insert repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hacs/default.git || true
          git fetch upstream master
          git checkout -B add-xav59213-freesmsxa upstream/master
          python3 - <<'PY'
          from pathlib import Path
          path = Path("integration")
          lines = path.read_text().splitlines(keepends=True)
          entry = '  "XAV59213/freesmsxa",
'
          if any('XAV59213/freesmsxa' in line for line in lines):
              print("already present")
          else:
              inserted = False
              out = []
              for line in lines:
                  if (not inserted) and '"Xerolux/idm-heatpump-hass"' in line:
                      out.append(entry)
                      inserted = True
                  out.append(line)
              if not inserted:
                  raise SystemExit('insertion point not found')
              path.write_text(''.join(out))
              print('inserted before Xerolux/idm-heatpump-hass')
          PY
          git add integration
          git status
          git diff --cached -- integration | head -n 40
          git commit -m "Adds new integration [XAV59213/freesmsxa]"
          git push --force origin add-xav59213-freesmsxa
