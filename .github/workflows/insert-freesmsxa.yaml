name: Insert freesmsxa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert XAV59213/freesmsxa alphabetically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/hacs/default.git || true
          git fetch upstream master
          git checkout -B add-xav59213-freesmsxa upstream/master
          if grep -F XAV59213/freesmsxa integration; then
            echo already-present
          else
            sed -i '/Xerolux\/idm-heatpump-hass/i \  "XAV59213/freesmsxa",' integration
          fi
          grep -n -C1 XAV59213/freesmsxa integration
          git add integration
          git commit -m "Adds new integration [XAV59213/freesmsxa]"
          git push --force origin add-xav59213-freesmsxa
