name: Add Ufanet Intercom

on:
  push:
    branches:
      - add-ufanet-intercom
    paths:
      - .github/workflows/add-ufanet-intercom.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          ref: add-ufanet-intercom

      - name: Add repository to integration list
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integration")
          text = path.read_text(encoding="utf-8")
          old = '  "alpenfun/fems-diagnostics",\n  "alray31/RAV311-Remote",'
          new = '  "alpenfun/fems-diagnostics",\n  "alphazulu/ufanet-intercom-home-assistant",\n  "alray31/RAV311-Remote",'
          if text.count(old) != 1:
              raise SystemExit("Expected insertion point not found exactly once")
          if '"alphazulu/ufanet-intercom-home-assistant"' in text:
              raise SystemExit("Repository already present")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit submission and remove temporary workflow
        run: |
          rm .github/workflows/add-ufanet-intercom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration .github/workflows/add-ufanet-intercom.yml
          git commit -m "Add alphazulu/ufanet-intercom-home-assistant"
          git push origin HEAD:add-ufanet-intercom
