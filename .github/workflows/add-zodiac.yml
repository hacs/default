name: Add Zodiac Pool Robot to HACS default

on:
  push:
    branches:
      - add-zodiac-pool-robot
    paths:
      - .github/workflows/add-zodiac.yml

permissions:
  contents: write

jobs:
  update-integration-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-zodiac-pool-robot
      - name: Add repository to integration list
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("integration")
          content = path.read_text()
          anchor = '  "grunna/ha-anycubic-kobra-x-lan",\n'
          entry = '  "grundicmd/HA-SmartPool",\n'

          if entry not in content:
              if anchor not in content:
                  raise SystemExit("Insertion anchor not found")
              content = content.replace(anchor, anchor + entry, 1)
              path.write_text(content)
          PY
      - name: Commit integration list change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration
          if ! git diff --cached --quiet; then
            git commit -m "Add grundicmd/HA-SmartPool"
            git push origin HEAD:add-zodiac-pool-robot
          fi
