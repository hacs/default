name: Prepare Eshtaya HACS submission

on:
  push:
    branches:
      - add-eshtaya-smart-control

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-eshtaya-smart-control

      - name: Insert repository without reformatting HACS defaults
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("integration")
          text = path.read_text(encoding="utf-8")
          repository = "badereshtaya/hacs-eshtaya-smart-control"
          if f'"{repository}"' not in text:
              lines = text.splitlines(keepends=True)
              target = repository.casefold()
              inserted = False
              for index, line in enumerate(lines):
                  match = re.match(r'^\s*"([^"]+)"', line)
                  if match and match.group(1).casefold() > target:
                      newline = "\r\n" if line.endswith("\r\n") else "\n"
                      indent = line[: len(line) - len(line.lstrip())]
                      lines.insert(index, f'{indent}"{repository}",{newline}')
                      inserted = True
                      break
              if not inserted:
                  raise RuntimeError("Could not find alphabetical insertion point")
              path.write_text("".join(lines), encoding="utf-8")

          workflow = Path(".github/workflows/add_eshtaya_submission.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit minimal submission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration .github/workflows/add_eshtaya_submission.yml
          git commit -m "Adds new integration [badereshtaya/hacs-eshtaya-smart-control]"
          git push origin HEAD:add-eshtaya-smart-control
